{% extends "base.html" %}
{% block title %}Create Support Ticket | SupportSphere{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div style="width: 100%; max-width: 680px;">
        <div class="card-modern p-5 animate-slide-up">
            <div class="flex items-center gap-3 mb-4">
                <div class="stat-icon-wrapper indigo" style="width: 50px; height: 50px; font-size: 1.4rem;">
                    <i class="bi bi-plus-circle-fill"></i>
                </div>
                <div>
                    <h2 class="mb-1">Submit a Support Ticket</h2>
                    <p class="text-muted small m-0">Provide details about your query so our staff can assist you rapidly.</p>
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group mb-3">
                    <label for="id_title" class="form-label">
                        <i class="bi bi-chat-left-quote me-1 text-primary"></i> Ticket Subject
                    </label>
                    <input type="text" name="title" maxlength="200" required id="id_title" class="form-control" placeholder="Brief summary of your inquiry...">
                </div>

                <div class="form-group mb-3">
                    <label for="id_priority" class="form-label">
                        <i class="bi bi-flag me-1 text-primary"></i> Priority Level
                    </label>
                    <select name="priority" id="id_priority" class="form-select" required>
                        <option value="Low">Low - General Question</option>
                        <option value="Medium" selected>Medium - Standard Inquiry</option>
                        <option value="High">High - Urgent / Critical Problem</option>
                    </select>
                </div>

                <div class="form-group mb-4">
                    <label for="id_description" class="form-label">
                        <i class="bi bi-text-paragraph me-1 text-primary"></i> Detailed Description
                    </label>
                    <textarea name="description" id="id_description" rows="6" required class="form-control" placeholder="Please describe what happened, steps to reproduce, or any relevant details..."></textarea>
                </div>
                
                <div class="flex items-center justify-between pt-4 border-top" style="border-color: var(--border-subtle);">
                    <a href="{% url 'ticket-list' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Tickets
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send-fill"></i> Submit Ticket
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
