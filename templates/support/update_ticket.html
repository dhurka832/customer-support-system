{% extends "base.html" %}
{% block title %}Update Ticket | SupportSphere{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div style="width: 100%; max-width: 680px;">
        <div class="card-modern p-5 animate-slide-up">
            <div class="flex items-center gap-3 mb-4">
                <div class="stat-icon-wrapper amber" style="width: 50px; height: 50px; font-size: 1.4rem;">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h2 class="mb-1">Update Ticket Details</h2>
                    <p class="text-muted small m-0">Modify the subject, priority level, or explanation for this ticket.</p>
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group mb-3">
                    <label for="id_title" class="form-label">
                        <i class="bi bi-chat-left-quote me-1 text-primary"></i> Ticket Subject
                    </label>
                    <input type="text" name="title" value="{{ form.title.value|default:'' }}" maxlength="200" required id="id_title" class="form-control">
                </div>

                <div class="form-group mb-3">
                    <label for="id_priority" class="form-label">
                        <i class="bi bi-flag me-1 text-primary"></i> Priority Level
                    </label>
                    <select name="priority" id="id_priority" class="form-select" required>
                        <option value="Low" {% if form.priority.value == 'Low' %}selected{% endif %}>Low - General Question</option>
                        <option value="Medium" {% if form.priority.value == 'Medium' %}selected{% endif %}>Medium - Standard Inquiry</option>
                        <option value="High" {% if form.priority.value == 'High' %}selected{% endif %}>High - Urgent / Critical Problem</option>
                    </select>
                </div>

                <div class="form-group mb-4">
                    <label for="id_description" class="form-label">
                        <i class="bi bi-text-paragraph me-1 text-primary"></i> Detailed Description
                    </label>
                    <textarea name="description" id="id_description" rows="6" required class="form-control">{{ form.description.value|default:'' }}</textarea>
                </div>
                
                <div class="flex items-center justify-between pt-4 border-top" style="border-color: var(--border-subtle);">
                    <a href="{% url 'ticket-list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2-circle"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
